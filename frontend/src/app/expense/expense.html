<div class="expense-page">
  <section class="card form-card">
    <h2>Record Expenditure</h2>
    <p>Post actual expenses against an approved budget and keep finance teams informed.</p>

    <form (ngSubmit)="submitExpense()">
      <div class="form-group">
        <label for="budgetId">Budget Reference</label>
        <input id="budgetId" name="budgetId" [(ngModel)]="expense.budgetId" placeholder="Budget title or ID" required />
      </div>

      <div class="form-group">
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" [(ngModel)]="expense.amount" required />
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" [(ngModel)]="expense.category" required>
          <option value="">Select a category</option>
          <option *ngFor="let category of categoryOptions" [value]="category">{{ category }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Date</label>
        <input id="date" name="date" type="date" [(ngModel)]="expense.date" required />
      </div>

      <div class="form-group">
        <label for="description">Details</label>
        <textarea id="description" name="description" rows="3" [(ngModel)]="expense.description" placeholder="Add the purchase details or supporting note."></textarea>
      </div>

      <button type="submit">Save Expense</button>
    </form>

    <p class="message" *ngIf="message">{{ message }}</p>
  </section>

  <section class="summary-card">
    <span>Total Recorded Spend</span>
    <strong>₹{{ totalSpent | number }}</strong>
    <small>Expenses are marked as In Progress or Over Budget based on the remaining allocation.</small>
  </section>
</div>

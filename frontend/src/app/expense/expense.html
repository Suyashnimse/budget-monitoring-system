<div class="card">
  <h2>Expenses</h2>
  <p>Track recent purchases and keep spending under control.</p>

  <form (ngSubmit)="submitExpense()">
    <div class="form-group">
      <label for="budgetId">Budget ID</label>
      <input id="budgetId" name="budgetId" [(ngModel)]="expense.budgetId" required />
    </div>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" [(ngModel)]="expense.amount" required />
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input id="category" name="category" [(ngModel)]="expense.category" required />
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input id="date" name="date" type="date" [(ngModel)]="expense.date" required />
    </div>

    <button type="submit">Save</button>
  </form>

  <p *ngIf="message">{{ message }}</p>
</div>
